<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Student Expense Tracker</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <header>
        <h1>🎓 Student Expense Tracker</h1>
        <p class="subtitle">Track your spending, stay on budget</p>
    </header>

    <main>

        <!-- Summary Cards -->
        <section class="summary-cards">
            <div class="card">
                <span class="card-label">Total Spent</span>
                <span class="card-value" id="totalAmount">₹0.00</span>
            </div>
            <div class="card">
                <span class="card-label">No. of Expenses</span>
                <span class="card-value" id="expenseCount">0</span>
            </div>
            <div class="card">
                <span class="card-label">Top Category</span>
                <span class="card-value" id="topCategory">—</span>
            </div>
        </section>

        <!-- Add Expense Form -->
        <section class="form-section">
            <h2>Add Expense</h2>
            <div class="form-grid">
                <div class="form-group">
                    <label for="amount">Amount (₹)</label>
                    <input type="number" id="amount" placeholder="e.g. 150" min="0.01" step="0.01" />
                </div>
                <div class="form-group">
                    <label for="category">Category</label>
                    <select id="category">
                        <option value="">-- Select --</option>
                        <option value="Food">🍔 Food</option>
                        <option value="Transport">🚌 Transport</option>
                        <option value="Books">📚 Books</option>
                        <option value="Entertainment">🎮 Entertainment</option>
                        <option value="Health">💊 Health</option>
                        <option value="Clothing">👕 Clothing</option>
                        <option value="Other">📦 Other</option>
                    </select>
                </div>
                <div class="form-group full-width">
                    <label for="note">Note <span class="optional">(optional)</span></label>
                    <input type="text" id="note" placeholder="e.g. Lunch with friends" />
                </div>
            </div>
            <button id="addBtn" onclick="addExpense()">+ Add Expense</button>
        </section>

        <!-- Filter & Search -->
        <section class="filter-section">
            <input type="text" id="searchInput" placeholder="🔍 Search by note or category..." oninput="renderTable()" />
            <select id="filterCategory" onchange="renderTable()">
                <option value="">All Categories</option>
                <option value="Food">Food</option>
                <option value="Transport">Transport</option>
                <option value="Books">Books</option>
                <option value="Entertainment">Entertainment</option>
                <option value="Health">Health</option>
                <option value="Clothing">Clothing</option>
                <option value="Other">Other</option>
            </select>
        </section>

        <!-- Expense Table -->
        <section class="table-section">
            <h2>Expense List</h2>
            <div class="table-wrapper">
                <table id="expenseTable">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Category</th>
                            <th>Amount (₹)</th>
                            <th>Note</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="expenseBody">
                        <tr id="emptyRow">
                            <td colspan="5" class="empty-msg">No expenses added yet.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>

        <!-- Category Breakdown -->
        <section class="breakdown-section">
            <h2>Category Breakdown</h2>
            <div id="breakdown"></div>
        </section>

        <!-- Actions -->
        <section class="actions">
            <button class="btn-secondary" onclick="clearAll()">🗑 Clear All</button>
            <button class="btn-secondary" onclick="exportCSV()">📥 Export CSV</button>
        </section>

    </main>

    <footer>
        <p>Student Expense Tracker &copy; 2024</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
